name: Husk OS V3 real completion restarts
on:
  workflow_dispatch:
  push:
    branches: [codex/v3-phase2]
    paths: [.github/v3-restart-request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: husk-v3-completion-restarts
  cancel-in-progress: true
jobs:
  source:
    uses: ./.github/workflows/tests.yml
  completion:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        completion: [now, automatic]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate the immutable image request
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          request=json.loads(Path('.github/v3-restart-request.json').read_text())
          for name,pattern in [('source','[0-9a-f]{40}'),('sha256','[0-9a-f]{64}'),('run','[1-9][0-9]{8,15}'),('bytes','[1-9][0-9]{8,12}')]:
              value=str(request[name])
              if re.fullmatch(pattern,value) is None: raise ValueError('Invalid image '+name)
              with open(os.environ['GITHUB_ENV'],'a') as stream: stream.write('HUSK_IMAGE_'+name.upper()+'='+value+'\n')
          PY
      - name: Recover the verified ISO without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$HUSK_IMAGE_RUN" --jq .head_sha)" = "$HUSK_IMAGE_SOURCE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$HUSK_IMAGE_RUN" --jq .head_branch)" = codex/v3-phase2
          mkdir -p out
          gh run download "$HUSK_IMAGE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "HuskOS-v3-UNVERIFIED-candidate-$HUSK_IMAGE_RUN" --dir out
          test "$(stat -c '%s' out/HuskOS-v3-phase2.iso)" = "$HUSK_IMAGE_BYTES"
          test "$(cut -d ' ' -f1 out/HuskOS-v3-phase2-SHA256.txt)" = "$HUSK_IMAGE_SHA256"
          (cd out && sha256sum -c HuskOS-v3-phase2-SHA256.txt)
          git diff --exit-code "$HUSK_IMAGE_SOURCE" HEAD -- src bin config data branding installer iso native packaging
          printf 'image_source=%s\ntest_source=%s\n' "$HUSK_IMAGE_SOURCE" "$GITHUB_SHA" > out/restart-image-source.txt
      - name: Prepare disposable VM tools and the exact image kernel
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf python3-pil xorriso
          if [ -c /dev/kvm ]; then
            sudo chown "$(id -u):$(id -g)" /dev/kvm
            sudo chmod 0600 /dev/kvm
          fi
          mkdir -p .build
          xorriso -osirrox on -indev out/HuskOS-v3-phase2.iso \
            -extract /arch/boot/x86_64 "$PWD/.build/v3-iso-boot" > out/restart-kernel-extraction.log 2>&1
      - name: Compile only the guarded test input driver
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/src" \
            -e HUSK_HOST_UID="$(id -u)" -e HUSK_HOST_GID="$(id -g)" \
            archlinux:base-devel bash -euc '
              pacman -Sy --noconfirm archlinux-keyring
              pacman -Syu --noconfirm --needed qt6-base qt6-declarative pkgconf
              cd /src
              c++ -std=c++17 -Wall -Wextra -Werror -fPIC -shared \
                scripts/v3-installer-driver.cpp -o out/v3-installer-driver.so \
                $(pkg-config --cflags --libs Qt6Widgets Qt6Test Qt6Quick)
              chown "$HUSK_HOST_UID:$HUSK_HOST_GID" out/v3-installer-driver.so
            '
      - name: Install offline and observe the actual completion restart and installed UEFI boot
        run: |
          timeout 3000 /usr/bin/python3 scripts/ci-test-v3-install.py \
            --completion '${{ matrix.completion }}' --artifacts out/restart-v3 \
            --timeout 1800 --boot-timeout 600
      - name: Preserve evidence without disks, passwords, keys or a release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-completion-${{ matrix.completion }}-${{ github.run_id }}
          path: |
            out/*.txt
            out/*.log
            out/restart-v3/*.json
            out/restart-v3/*.log
            out/restart-v3/*.png
          if-no-files-found: warn
          retention-days: 30
