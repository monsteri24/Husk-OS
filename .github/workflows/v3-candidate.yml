name: Husk OS V3 candidate and disposable installation
on:
  workflow_dispatch:
  push:
    branches: [codex/v3-phase2]
    paths: [.github/v3-build-request]
permissions:
  contents: read
concurrency:
  group: husk-v3-candidate
  cancel-in-progress: false
jobs:
  source:
    uses: ./.github/workflows/tests.yml
  desktop:
    uses: ./.github/workflows/system2-desktop.yml
  build-and-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare the disposable build runner and VM tools
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          test "$(df -B1 --output=avail . | tail -1 | tr -d ' ')" -ge 34359738368
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf python3-pil xorriso
          if [ -c /dev/kvm ]; then
            sudo chown "$(id -u):$(id -g)" /dev/kvm
            sudo chmod 0600 /dev/kvm
          fi
      - name: Build signed packages and inspect the completed ISO
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/husk-v3-gnupg"
          timeout 2700 docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/src" \
            -v "$RUNNER_TEMP/husk-v3-gnupg:/husk-gnupg" \
            -e SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
            -e HUSK_SOURCE_SHA="$GITHUB_SHA" \
            -e HUSK_HOST_UID="$(id -u)" -e HUSK_HOST_GID="$(id -g)" \
            archlinux:base-devel bash /src/scripts/ci-build-v3.sh
      - name: Preserve the exact candidate before VM acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HuskOS-v3-UNVERIFIED-candidate-${{ github.run_id }}
          path: |
            out/HuskOS-v3-phase2.iso
            out/HuskOS-v3-phase2-SHA256.txt
            out/HuskOS-v3-phase2-SIZE.txt
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
      - name: Boot the exact Live ISO through UEFI
        run: |
          (cd out && sha256sum -c HuskOS-v3-phase2-SHA256.txt)
          timeout 780 /usr/bin/python3 scripts/ci-test-system1.py \
            --iso out/HuskOS-v3-phase2.iso --artifacts out/boot-v3 --expected-version v3-phase2 --require-live-write-space
      - name: Install offline onto a new disposable disk and boot it through UEFI
        run: |
          timeout 3000 /usr/bin/python3 scripts/ci-test-v3-install.py \
            --iso out/HuskOS-v3-phase2.iso --artifacts out/install-v3 \
            --kernel .build/v3-iso-boot/vmlinuz-linux \
            --initrd .build/v3-iso-boot/initramfs-linux.img \
            --driver out/v3-installer-driver.so --timeout 1800 --boot-timeout 600
      - name: Verify actual Live graphical Steam installation on the same completed ISO
        run: |
          (cd out && sha256sum -c HuskOS-v3-phase2-SHA256.txt)
          timeout 1800 /usr/bin/python3 scripts/ci-test-v3-live-app.py --timeout 1500
      - name: Preserve diagnostic evidence without disks, passwords or signing keys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-candidate-evidence-${{ github.run_id }}
          path: |
            out/*.json
            out/*.txt
            out/*.log
            out/boot-v3/*.json
            out/boot-v3/*.log
            out/boot-v3/*.png
            out/install-v3/*.json
            out/install-v3/*.log
            out/install-v3/*.png
            out/live-app-v3/*.json
            out/live-app-v3/*.log
            out/live-app-v3/*.png
          if-no-files-found: warn
          retention-days: 30
