name: Husk OS V3 actual Live graphical application acceptance
on:
  workflow_dispatch:
  push:
    branches: [codex/v3-phase2]
    paths: [.github/v3-live-app-request.json]
permissions:
  contents: read
  actions: read
concurrency:
  group: husk-v3-live-application
  cancel-in-progress: false
jobs:
  source:
    uses: ./.github/workflows/tests.yml
  live-application:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate the immutable image request
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          request=json.loads(Path('.github/v3-live-app-request.json').read_text())
          application=request.get('application','steam')
          if application not in ('steam','heroic','gaming','hardware'): raise ValueError('Invalid application acceptance target')
          with open(os.environ['GITHUB_ENV'],'a') as stream: stream.write('HUSK_TEST_APPLICATION='+application+'\n')
          memory=request.get('memory_mib',4096)
          if type(memory) is not int or memory not in (4096,8192,12288): raise ValueError('Invalid bounded guest memory')
          with open(os.environ['GITHUB_ENV'],'a') as stream: stream.write('HUSK_VM_MEMORY_MIB='+str(memory)+'\n')
          for name,pattern in [('source','[0-9a-f]{40}'),('sha256','[0-9a-f]{64}'),('run','[1-9][0-9]{8,15}'),('bytes','[1-9][0-9]{8,12}')]:
              value=str(request[name])
              if re.fullmatch(pattern,value) is None: raise ValueError('Invalid image '+name)
              with open(os.environ['GITHUB_ENV'],'a') as stream: stream.write('HUSK_IMAGE_'+name.upper()+'='+value+'\n')
          PY
      - name: Recover the accepted ISO without rebuilding it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$HUSK_IMAGE_RUN" --jq .head_sha)" = "$HUSK_IMAGE_SOURCE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$HUSK_IMAGE_RUN" --jq .head_branch)" = codex/v3-phase2
          mkdir -p out
          gh run download "$HUSK_IMAGE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "HuskOS-v3-UNVERIFIED-candidate-$HUSK_IMAGE_RUN" --dir out
          test "$(stat -c '%s' out/HuskOS-v3-phase2.iso)" = "$HUSK_IMAGE_BYTES"
          test "$(cut -d ' ' -f1 out/HuskOS-v3-phase2-SHA256.txt)" = "$HUSK_IMAGE_SHA256"
          (cd out && sha256sum -c HuskOS-v3-phase2-SHA256.txt)
          git diff --exit-code "$HUSK_IMAGE_SOURCE" HEAD -- src bin config data branding installer iso native packaging
          printf 'image_source=%s\ntest_source=%s\n' "$HUSK_IMAGE_SOURCE" "$GITHUB_SHA" > out/application-image-source.txt
      - name: Prepare disposable UEFI VM tools and the exact image kernel
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          memory={key:int(value.split()[0]) for key,value in
              (line.split(':',1) for line in Path('/proc/meminfo').read_text().splitlines())
              if key in ('MemTotal','MemAvailable','SwapTotal')}
          Path('out/application-host-resources.txt').write_text(json.dumps(memory,indent=2)+'\n')
          required=(int(os.environ['HUSK_VM_MEMORY_MIB'])+2048)*1024
          if min(memory['MemTotal'],memory['MemAvailable'])<required:
              raise RuntimeError('The host does not have guest RAM plus 2 GiB of host headroom')
          PY
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf python3-pil xorriso
          if [ -c /dev/kvm ]; then
            sudo chown "$(id -u):$(id -g)" /dev/kvm
            sudo chmod 0600 /dev/kvm
          fi
          mkdir -p .build
          xorriso -osirrox on -indev out/HuskOS-v3-phase2.iso \
            -extract /arch/boot/x86_64 "$PWD/.build/v3-iso-boot" > out/application-kernel-extraction.log 2>&1
      - name: Exercise the actual requested Live application
        run: |
          set -euo pipefail
          case "$HUSK_TEST_APPLICATION" in
            steam) harness=scripts/ci-test-v3-live-app.py ;;
            heroic) harness=scripts/ci-test-v3-live-heroic.py ;;
            gaming) harness=scripts/ci-test-v3-live-gaming.py ;;
            hardware)
              for mode in control protected; do
                timeout 780 /usr/bin/python3 scripts/ci-test-system1.py \
                  --iso out/HuskOS-v3-phase2.iso --expected-version v3-phase2 \
                  --require-live-write-space --hardware-usb "$mode" \
                  --artifacts "out/live-app-v3/hardware-$mode"
              done
              exit 0 ;;
            *) exit 1 ;;
          esac
          timeout 1800 /usr/bin/python3 "$harness" --timeout 1500 --memory-mib "$HUSK_VM_MEMORY_MIB"
      - name: Preserve observations without disks, credentials or a release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-live-application-${{ github.run_id }}
          path: |
            out/application-*.txt
            out/application-*.log
            out/live-app-v3/*.json
            out/live-app-v3/*.log
            out/live-app-v3/*.png
            out/live-app-v3/game-audio-clip.wav
            out/live-app-v3/hardware-*/*.json
            out/live-app-v3/hardware-*/*.log
            out/live-app-v3/hardware-*/*.png
          if-no-files-found: warn
          retention-days: 30
