name: Husk OS V3 recovered candidate acceptance
on:
  workflow_dispatch:
  push:
    branches: [codex/v3-phase2]
    paths: [.github/v3-acceptance-request]
permissions:
  contents: read
  actions: read
concurrency:
  group: husk-v3-recovered-acceptance-39123206803
  cancel-in-progress: true
jobs:
  source:
    uses: ./.github/workflows/tests.yml
  desktop:
    uses: ./.github/workflows/system2-desktop.yml
  recovered-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      HUSK_IMAGE_SOURCE: 0ac564dbd141f00bcfd68503fbe75f9065041e51
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Recover the exact completed ISO and verify its digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/39123206803" --jq .head_sha)" = "$HUSK_IMAGE_SOURCE"
          mkdir -p out
          gh run download 39123206803 --repo "$GITHUB_REPOSITORY" \
            --name HuskOS-v3-UNVERIFIED-candidate-39123206803 --dir out
          test "$(stat -c '%s' out/HuskOS-v3-phase2.iso)" = 2214559744
          test "$(cut -d ' ' -f1 out/HuskOS-v3-phase2-SHA256.txt)" = 7597f76451ed19829e4e8b4fe6879d7ce11f95cee43901aa38ceae6fbedd6088
          (cd out && sha256sum -c HuskOS-v3-phase2-SHA256.txt)
          mkdir -p .build/prior-evidence
          gh run download 39123206803 --repo "$GITHUB_REPOSITORY" \
            --name v3-candidate-evidence-39123206803 --dir .build/prior-evidence
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          prior = Path('.build/prior-evidence')
          build = json.loads((prior/'v3-build.json').read_text())
          boot = json.loads((prior/'boot-v3/result.json').read_text())
          assert build['source_commit'] == os.environ['HUSK_IMAGE_SOURCE']
          assert boot['iso_sha256'] == '7597f76451ed19829e4e8b4fe6879d7ce11f95cee43901aa38ceae6fbedd6088'
          assert boot['iso_bytes'] == 2214559744
          assert all(boot[name] == 'PASSED' for name in ('boot','terminal','shutdown'))
          assert boot['desktop_status']['version'] == 'v3-phase2'
          boot['proof_reused_from_run'] = 39123206803
          boot['proof_scope'] = 'Prior real Live UEFI boot of this exact immutable image; not rerun in this workflow'
          Path('out/reused-live-boot.json').write_text(json.dumps(boot,indent=2)+'\n')
          PY
          printf 'image_source=%s\nacceptance_source=%s\n' "$HUSK_IMAGE_SOURCE" "$GITHUB_SHA" > out/recovered-image-source.txt
          git diff --stat "$HUSK_IMAGE_SOURCE" HEAD -- src bin config data branding installer iso native packaging > out/changes-since-image.txt
          # The profile generator's new compression is not in this reused ISO.
          # Record that build-only difference; require identical runtime sources.
          git diff "$HUSK_IMAGE_SOURCE" HEAD -- src/ownos/build.py > out/build-profile-changes-not-in-image.txt
          git diff --exit-code "$HUSK_IMAGE_SOURCE" HEAD -- src bin config data branding installer iso native packaging ':(exclude)src/ownos/build.py'
      - name: Install VM tools and inspect the exact recovered payload
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf python3-pil python3-yaml xorriso squashfs-tools
          mkdir -p .build
          xorriso -osirrox on -indev out/HuskOS-v3-phase2.iso \
            -extract /arch/x86_64/airootfs.sfs "$PWD/.build/v3-rootfs.sfs" \
            -extract /arch/boot/x86_64 "$PWD/.build/v3-iso-boot" > out/iso-extraction.log 2>&1
          sudo unsquashfs -processors 2 -d .build/v3-iso-root .build/v3-rootfs.sfs > out/squashfs-extraction.log 2>&1
          cat .build/v3-iso-root/etc/locale.conf | tee out/live-locale.txt
          /usr/bin/python3 scripts/check-rootfs.py .build/v3-iso-root --boot .build/v3-iso-boot > out/iso-rootfs-check.json
          sudo /usr/bin/python3 scripts/check-v3-rootfs.py .build/v3-iso-root --boot .build/v3-iso-boot > out/v3-rootfs-check.json
      - name: Compile only the current test driver against the candidate Qt runtime
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/src" \
            -e HUSK_HOST_UID="$(id -u)" -e HUSK_HOST_GID="$(id -g)" \
            archlinux:base-devel bash -euc '
              pacman -Sy --noconfirm archlinux-keyring
              pacman -Syu --noconfirm --needed qt6-base qt6-declarative pkgconf
              cd /src
              c++ -std=c++17 -Wall -Wextra -Werror -fPIC -shared \
                scripts/v3-installer-driver.cpp -o out/v3-installer-driver.so \
                $(pkg-config --cflags --libs Qt6Widgets Qt6Test Qt6Quick)
              chown "$HUSK_HOST_UID:$HUSK_HOST_GID" out/v3-installer-driver.so
            '
      - name: Cancel without writes, install offline and boot the installed UEFI disk
        run: timeout 3000 /usr/bin/python3 scripts/ci-test-v3-install.py --artifacts out/install-v3 --expected-version v3-phase2 --timeout 1800 --boot-timeout 600
      - name: Preserve bounded evidence for this exact image, without publishing a release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-recovered-acceptance-${{ github.run_id }}
          path: |
            out/*.json
            out/*.txt
            out/*.log
            out/boot-v3/*.json
            out/boot-v3/*.log
            out/boot-v3/*.png
            out/install-v3/*.json
            out/install-v3/*.log
            out/install-v3/*.png
          if-no-files-found: warn
          retention-days: 30
