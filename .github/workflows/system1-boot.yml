name: Husk OS System 1 published ISO boot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/system1-boot.yml]
permissions:
  contents: read
jobs:
  qemu-ovmf:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download and verify the already secured ISO
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir out
          gh release download system-1 --repo "$GITHUB_REPOSITORY" --dir out \
            --pattern HuskOS-system-1.iso --pattern HuskOS-system-1-SHA256.txt
          cd out
          sha256sum -c HuskOS-system-1-SHA256.txt
      - name: Install VM test tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 ovmf python3-pil
      - name: Actual ISO CD-ROM UEFI boot and desktop acceptance
        run: /usr/bin/python3 scripts/ci-test-system1.py
      - name: Save actual screenshots and guest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HuskOS-system-1-boot-evidence
          path: |
            out/boot-system1/*.png
            out/boot-system1/*.json
            out/boot-system1/*.log
          if-no-files-found: error
          retention-days: 14
