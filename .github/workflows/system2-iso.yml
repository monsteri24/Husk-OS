name: Husk OS System 2 ISO
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/system2-build-request]
permissions:
  contents: read
concurrency:
  group: husk-system-2-release
  cancel-in-progress: false
jobs:
  source:
    uses: ./.github/workflows/tests.yml
  desktop:
    uses: ./.github/workflows/system2-desktop.yml
  build-boot-publish:
    needs: [source, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify committed source and preserve existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          gh release view system-1 --repo "$GITHUB_REPOSITORY" --json tagName,assets
          if gh release view system-2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'System 2 already exists; preserving every existing asset.' >&2
            exit 1
          fi
          reuse_run=$(sed -n 's/^reuse_run_id=//p' .github/system2-build-request)
          image_source="$GITHUB_SHA"
          if [[ -n "$reuse_run" ]]; then
            # Continue the already built and checked image; never rebuild it
            # merely because the independent application smoke test failed.
            test "$reuse_run" = 39001566844
            image_source=b1c27dd8bc73d7dc4e9f9856083dd69c67f30d58
            test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$reuse_run" --jq .head_sha)" = "$image_source"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$reuse_run/jobs" > "$RUNNER_TEMP/prior-jobs.json"
            jq -e '[.jobs[] | select(.name == "source / models-and-gtk-preview" or .name == "desktop / labwc-desktop")] | length == 2 and all(.[]; .conclusion == "success")' "$RUNNER_TEMP/prior-jobs.json"
            git diff --exit-code "$image_source" HEAD -- src bin config data branding installer iso native packaging
          fi
          printf 'HUSK_REUSE_RUN=%s\nHUSK_IMAGE_SOURCE=%s\n' "$reuse_run" "$image_source" >> "$GITHUB_ENV"
      - name: Prepare disposable runner disk and VM dependencies
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h .
          test "$(df -B1 --output=avail . | tail -1 | tr -d ' ')" -ge 26843545600
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf python3-pil
      - name: Recover the exact completed ISO and original build evidence
        if: env.HUSK_REUSE_RUN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out "$RUNNER_TEMP/husk-recovery"
          gh run download "$HUSK_REUSE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "HuskOS-system-2-recovery-$HUSK_REUSE_RUN" --dir "$RUNNER_TEMP/husk-recovery"
          gh run download "$HUSK_REUSE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name "system2-release-evidence-$HUSK_REUSE_RUN" --dir out
          cmp "$RUNNER_TEMP/husk-recovery/HuskOS-system-2-SHA256.txt" out/HuskOS-system-2-SHA256.txt
          mv "$RUNNER_TEMP/husk-recovery/HuskOS-system-2.iso" out/
          test "$(jq -r .source_commit out/system2-build.json)" = "$HUSK_IMAGE_SOURCE"
          test "$(stat -c '%s' out/HuskOS-system-2.iso)" = 2101264384
          test "$(cut -d ' ' -f1 out/HuskOS-system-2-SHA256.txt)" = d36214faecce244cf5c92e0730849857821499cae4f20c3bd71f2448952e8f99
          (cd out && sha256sum -c HuskOS-system-2-SHA256.txt)
      - name: Build signed packages and verify the actual ISO filesystem
        if: env.HUSK_REUSE_RUN == ''
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/husk-gnupg"
          timeout 1800 docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/src" \
            -v "$RUNNER_TEMP/husk-gnupg:/husk-gnupg" \
            -e SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
            -e HUSK_SOURCE_SHA="$GITHUB_SHA" \
            -e HUSK_HOST_UID="$(id -u)" -e HUSK_HOST_GID="$(id -g)" \
            archlinux:base-devel bash /src/scripts/ci-build-system2.sh
      - name: Reverify the recovered ISO and complete the real application test
        if: env.HUSK_REUSE_RUN != ''
        run: |
          set -euo pipefail
          timeout 900 docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/src" \
            -e HUSK_SOURCE_SHA="$HUSK_IMAGE_SOURCE" \
            -e HUSK_HOST_UID="$(id -u)" -e HUSK_HOST_GID="$(id -g)" \
            archlinux:base-devel bash /src/scripts/ci-complete-system2.sh
      - name: Boot the exact candidate through QEMU and OVMF
        run: |
          cd out
          sha256sum -c HuskOS-system-2-SHA256.txt
          cd ..
          timeout 780 /usr/bin/python3 scripts/ci-test-system1.py \
            --iso out/HuskOS-system-2.iso --artifacts out/boot-system2 --expected-version system-2
      - name: Publish the verified System 2 and verify its download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          iso_sha=$(cut -d ' ' -f1 out/HuskOS-system-2-SHA256.txt)
          iso_size=$(cat out/HuskOS-system-2-SIZE.txt)
          cat > out/RELEASE-NOTES.md <<EOF
          Husk OS System 2 is an experimental Arch-based gaming operating system with its own GTK Husk Desktop and Labwc/Wayland.

          This release is a Live USB/VM environment. It has no completed graphical operating-system installer. The historical System 1 release is preserved unchanged.

          Includes the original black-and-gold desert wallpaper, English UI, Start/search/taskbar, window controls, Husk Settings, Husk Files, Foot terminal and user-confirmed optional application installation. System 2 supports English only; Finnish translations are preserved in source for a future release. Steam, Firefox, Heroic and other optional user apps are not preinstalled.

          Source/GTK/native and real nested Labwc interaction checks passed before building. The resulting ISO filesystem, exact wallpaper and installed package inventory were checked, then the exact ISO booted through QEMU/OVMF to the live Wayland desktop and shut down. A real signed Firefox installation and headless launch were tested separately in the disposable Arch build container; this is not a physical hardware or GUI authentication test.

          Known limits: no System 2 physical hardware acceptance; no game/FPS, NVIDIA/Optimus, VRR, suspend, multi-monitor or long-duration certification. CPU policy and Optimus controls are planned. GameMode/MangoHud and 32-bit gaming libraries are optional and must be installed when needed; first-boot edition ships 64-bit Mesa. Unsupported anti-cheat games are not promised. Native .hpk packaging and a maintained Husk update repository remain planned. GUI/polkit authentication for a real network application installation on Live hardware still needs acceptance testing.

          Image source commit: $HUSK_IMAGE_SOURCE
          Verification workflow commit: $GITHUB_SHA
          Filename: HuskOS-system-2.iso
          Size: $iso_size bytes
          SHA-256: $iso_sha

          Download/checksum/USB guide: https://github.com/$GITHUB_REPOSITORY/blob/main/docs/INSTALL.md
          Automated evidence is attached. Physical USB testing is separate.
          EOF
          gh release create system-2 --repo "$GITHUB_REPOSITORY" --target "$HUSK_IMAGE_SOURCE" \
            --title 'Husk OS System 2 — Experimental Live' --prerelease --notes-file out/RELEASE-NOTES.md \
            out/HuskOS-system-2.iso out/HuskOS-system-2-SHA256.txt out/system2-build.json \
            out/iso-rootfs-check.json out/boot-system2/result.json out/boot-system2/guest.json \
            out/boot-system2/desktop-start.png out/boot-system2/desktop-terminal.png \
            out/firefox-package.txt out/firefox-version.txt out/firefox-headless.png
          asset=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/system-2" \
            --jq '.assets[] | select(.name=="HuskOS-system-2.iso")')
          test "$(jq -r .state <<< "$asset")" = uploaded
          test "$(jq -r .size <<< "$asset")" = "$iso_size"
          test "$(jq -r .digest <<< "$asset")" = "sha256:$iso_sha"
          download_url=$(jq -r .browser_download_url <<< "$asset")
          curl --fail --location --retry 2 --max-time 600 "$download_url" -o "$RUNNER_TEMP/HuskOS-system-2.iso"
          test "$(sha256sum "$RUNNER_TEMP/HuskOS-system-2.iso" | cut -d ' ' -f1)" = "$iso_sha"
          printf 'ISO: %s\nSize: %s bytes\nSHA-256: %s\nSource: %s\nQEMU/OVMF: PASSED\nPhysical hardware: NOT TESTED\n' \
            "$download_url" "$iso_size" "$iso_sha" "$HUSK_IMAGE_SOURCE" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Preserve bounded test and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system2-release-evidence-${{ github.run_id }}
          path: |
            out/*.json
            out/*.txt
            out/*.log
            out/*.png
            out/boot-system2/*.json
            out/boot-system2/*.log
            out/boot-system2/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Secure a completed ISO if a later gate or release upload failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HuskOS-system-2-recovery-${{ github.run_id }}
          path: |
            out/HuskOS-system-2.iso
            out/HuskOS-system-2-SHA256.txt
          if-no-files-found: ignore
          retention-days: 7
