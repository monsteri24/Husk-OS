---
modules-search: [ local ]
branding: ownos
prompt-install: true
dont-chroot: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
instances:
  - id: desktop
    module: packagechooser
    config: desktop.conf
  - id: graphics
    module: packagechooser
    config: graphics.conf
sequence:
  - show:
      - welcome
      - keyboard
      - locale
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - owninstall
      - initcpio
      - bootloader
      - huskflush
      - umount
      - husksync
  - show: [ finishedq ]
