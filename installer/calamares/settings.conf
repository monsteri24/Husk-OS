---
modules-search: [ local ]
branding: ownos
prompt-install: false
dont-chroot: false
instances:
  - id: desktop
    module: packagechooser
    config: desktop.conf
  - id: graphics
    module: packagechooser
    config: graphics.conf
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - packagechooser@desktop
      - packagechooser@graphics
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - owninstall
      - initcpio
      - bootloader
      - umount
  - show: [ finished ]
